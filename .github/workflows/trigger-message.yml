name: Daily send image to whatsapp with message

on:
  schedule:
    - cron: '0 2,12 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
        run: node src/index.js

      - name: Commit event log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add event.log
          git commit -m "chore: log processed post" || echo "Nothing to commit"
          git push
